name: career-console

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./CareerConsole:/data/CareerConsole

services:
  career-console:
    container_name: career-console
    <<: *common-config
    command: ["serve", "--workspace", "/data/CareerConsole", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
  
  career-console-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status", "--workspace", "/data/CareerConsole"]
    stdin_open: true
    tty: true
